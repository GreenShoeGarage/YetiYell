[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.10.0
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = huge_app.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@6.21.5
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DYETI_BOARD=\"esp32dev\"

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DYETI_BOARD=\"esp32c3\"

[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.f_flash = 80000000L
build_flags = ${env.build_flags} -DYETI_BOARD=\"esp32s3\"
